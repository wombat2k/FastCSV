name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Test both ends of the supported range: the package floor
# (swift-tools-version) and the latest toolchain we develop on.
jobs:
  test-macos:
    name: Test (macOS, Swift ${{ matrix.swift }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        swift: ['6.2', '6.4']
    steps:
      - uses: actions/checkout@v4
      # v3 installs via Swiftly, so it can fetch any released toolchain;
      # v2 has a hardcoded version list that stops at 6.2.1.
      - name: Install Swift ${{ matrix.swift }}
        uses: swift-actions/setup-swift@v3.0.0-beta.1
        with:
          swift-version: ${{ matrix.swift }}
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Build Examples
        run: cd Examples && swift build

  test-linux:
    name: Test (Linux, Swift ${{ matrix.swift }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        swift: ['6.2', '6.4']
    container: swift:${{ matrix.swift }}
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Test
        run: swift test
